<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe6">
  <title>每日灵修问答｜2026年下半年</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="home-link" href="https://coos.davidowh.com/" aria-label="返回三点灵修分享首页">
    <span aria-hidden="true">🏠</span><span id="backLabel">返回</span>
  </a>

  <main class="app-shell">
    <div class="top-row">
      <div class="brand" aria-label="每日灵修问答">
        <img src="assets/icon-192.png" alt="每日灵修问答图标">
        <div>
          <div id="brandTitle" class="brand-title">每日灵修问答</div>
          <div id="brandSubtitle" class="brand-subtitle">聆听神的话，用祷告与行动回应</div>
        </div>
      </div>
      <div class="top-controls">
        <div class="language-switch" role="group" aria-label="Language">
          <button id="langZh" class="lang-btn active" type="button">中文</button>
          <button id="langEn" class="lang-btn" type="button">English</button>
        </div>
      </div>
    </div>

    <header class="hero">
      <div class="date-jump">
        <label id="jumpLabel" for="jumpDate">选择日期</label>
        <div class="date-jump-row">
          <input id="jumpDate" type="date" min="2026-07-01" max="2026-12-31">
          <button id="goDate" class="secondary" type="button">前往</button>
        </div>
      </div>
      <p id="dateLabel" class="date"></p>
      <h1 id="theme"></h1>
      <p id="scripture" class="scripture"></p>
      <p id="focus" class="focus"></p>
      <div class="hero-actions">
        <button id="speakPage" class="secondary">🔊 朗读今日内容</button>
        <button id="stopSpeech" class="secondary">停止朗读</button>
      </div>
    </header>

    <section id="questionCard" class="card"></section>
    <section id="reflectionCard" class="card hidden"></section>
    <section id="prayerCard" class="card hidden"></section>
    <section id="actionCard" class="card hidden"></section>

    <nav class="day-nav" aria-label="日期导航">
      <button id="prevDay" class="secondary">上一天</button>
      <span id="dayCounter"></span>
      <button id="nextDay" class="secondary">下一天</button>
    </nav>
  </main>
  <script src="app.js"></script>
</body>
</html>
